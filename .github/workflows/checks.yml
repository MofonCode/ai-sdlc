name: checks

# One entry point. Every failure these catch is silent at runtime - a skill with broken
# frontmatter is never loaded and says nothing, a gate that stops matching reads as
# approval - so they run on everything.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    # windows-latest for Windows PowerShell 5.1 specifically: the hook targets 5.1 because
    # that is the runtime present on every Windows machine with no install step, so testing
    # against pwsh would test something other than what ships.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The suite shells out to node for the workflow validator - the one check that
      # needs a JS parser, because a workflow body must be evaluated the way the
      # runtime evaluates it.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: dotnet test
        run: dotnet test tests/AiSdlc.Tests/AiSdlc.Tests.csproj --nologo
