# Build and test the sdlc binary, and decide the version a release of it would be (D-197). It publishes nothing:
# cd.yml does, from the package a push to main leaves here, once a person approves it.
#
#   a pull request    -> build and test as declared, and keep the packed tool as a run artifact
#   a push to main    -> the same at the build's own version, when the merge changes what ships, and keep the
#     -- a merged        packed tool for cd.yml, which asks a person whether to release it
#     pull request
#
# The version is <major>.<minor>.<build>. The props declare the line, <major>.<minor>.0, and the build is how many
# commits main has taken since that line last moved: the squash merge that moves it is build 0, the next merge 1.
# Nobody types the third number, so nobody can forget it, and two merges can never claim one. A merge that ships
# nothing takes a number too and publishes nothing, so the published builds have gaps, which is harmless.
#
# Only pushes that change what ships are built: the binary, the skills, the hooks and the manifests. A version on
# nuget.org can be unlisted but never deleted, so a release per documentation commit would be permanent noise. A
# push to main that ships nothing runs nothing beyond the version: its pull request built it.
#
# Feature branches are squashed into main by pull request and nothing else reaches it (D-197). There is no
# integration branch and no promotion: main is the trunk, and every merge to it that ships is a release a person
# can approve or reject.
#
# A build nobody published is a local build and is never pushed anywhere. The packed tool a pull request leaves
# as an artifact was built here, with CI set, so it carries the plain version; downloaded and used through
# SDLC_DEV_BUILD it calls itself local, as any dev build does.
#
# This repository is the framework, and it is built as an ordinary product -- branch, review, merge.
# It deliberately does NOT run `sdlc verify-chain` on itself: there is no `.sdlc/` directory here and
# adding one is wrong, because a framework judged by the constraints it is changing is a deadlock.
# AGENTS.md states that; this comment exists so nobody closes the gap by pointing the gate at itself.
#
# Read only, everywhere. A pull request's code runs in this workflow, so this workflow holds no right to publish
# and no token that could mint one: the OIDC exchange and the tag push live in cd.yml, which runs only main's
# code. A model is never called by a gate, here or in a governed solution.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A second push to the same pull request makes the first run's answer irrelevant, so stop it rather than pay
# for both. Never cancel a push: its package is what cd.yml releases, and on main the runs are the record of
# what the branch did.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The version, and whether a push changes what ships. A path filter on the trigger cannot say the second,
  # because the version is wanted either way and cd.yml needs the answer as a value rather than as a skipped run.
  version:
    name: what the build is
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      ships: ${{ steps.decide.outputs.ships }}
    steps:
      # The whole history: the build number is counted from it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Refused when the pieces disagree: plugin manifests that are not the line the props declare, or a third
      # number somebody typed. A binary and a plugin that disagree about which release they are is the failure
      # the session-start check exists to report, and it is cheaper to refuse it here -- on a pull request too,
      # so it is found before the merge rather than at it.
      #
      # A new branch has no previous commit, and a force push may have dropped it, so both count as shipping:
      # cd.yml then refuses a version already published, which is the safe direction to be wrong in.
      - name: Decide the version
        id: decide
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          prefix="$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)"
          for manifest in plugin.json .claude-plugin/plugin.json; do
            declared="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' "$manifest" | head -n 1)"
            if [ "$declared" != "$prefix" ]; then
              echo "::error::$manifest says $declared and Directory.Build.props says $prefix."
              exit 1
            fi
          done
          case "$prefix" in
            *.*.0) ;;
            *) echo "::error::Directory.Build.props declares $prefix. It declares the line, <major>.<minor>.0: the pipeline numbers the build."; exit 1 ;;
          esac

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            version="$prefix"
            ships=false
          else
            # The newest commit on main's own line that moved the version, and how many commits came after it.
            # First parent only, so a merge commit counts once and what it brought in is not counted again.
            line="$(git log --first-parent --diff-merges=first-parent --no-patch -1 --format=%H -G'<VersionPrefix>[0-9]' -- Directory.Build.props)"
            [ -n "$line" ] || { echo "::error::No commit on main's line ever set VersionPrefix."; exit 1; }
            build="$(git rev-list --count --first-parent "$line..$GITHUB_SHA")"
            version="${prefix%.0}.$build"

            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              ships=true
            elif git diff --name-only "$BEFORE" "$GITHUB_SHA" \
                | grep -Eq '^(src/|skills/|hooks/|\.claude-plugin/|plugin\.json$|CONSTRAINTS\.md$|Directory\.Build\.props$|Directory\.Packages\.props$|global\.json$)'; then
              ships=true
            else
              ships=false
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ships=$ships" >> "$GITHUB_OUTPUT"
          printf 'version=%s\nships=%s\n' "$version" "$ships" > release.txt
          echo "Building $version; changes what ships: $ships"

      # What cd.yml reads to decide whether there is anything to ask a person about. A push only: a pull
      # request's run never releases, and cd.yml listens to pushes alone besides.
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: release
          path: release.txt
          if-no-files-found: error
          retention-days: 30

  build:
    name: build, test and pack
    needs: version
    if: >-
      ${{ !cancelled() && needs.version.result == 'success' && (
          github.event_name == 'pull_request'
          || needs.version.outputs.ships == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Read the pin rather than restate it. global.json says 10.0.100 with rollForward
      # latestFeature, and a version written out here is a second place that decision lives -- the
      # copy being the one that goes stale is the failure this repository is largely about.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The repository's manifests say the line; the package carries both of them beside the binary, so they are
      # stamped with the build here, in this checkout only, and never committed. The suite then holds the stamped
      # pair to the binary exactly as it holds the declared pair on a laptop.
      - name: Stamp the build into the plugin manifests
        if: github.event_name == 'push'
        run: |
          for manifest in plugin.json .claude-plugin/plugin.json; do
            sed -i '0,/"version": *"[^"]*"/s//"version": "${{ needs.version.outputs.version }}"/' "$manifest"
            grep -q '"version": "${{ needs.version.outputs.version }}"' "$manifest" || { echo "::error::$manifest was not stamped."; exit 1; }
          done

      # Warnings are errors here, so a build that warns is a build that failed. Note that NuGetAudit
      # runs at moderate with NuGetAuditMode all: a newly disclosed advisory in any transitive
      # dependency turns this red on a pull request that touched nothing. That is deliberate -- it is
      # how you find out -- but it will look like CI broke when it happens.
      - name: Build
        run: dotnet build --configuration Release -p:Version=${{ needs.version.outputs.version }}

      # Bare `dotnet test`, with no verbosity flags. This solution runs on Microsoft.Testing.Platform
      # (global.json pins the runner), and VSTest-style flags like `-v q` make it run ZERO tests and
      # exit 5 while printing "failed: 0" on the way past. Do not add flags here.
      - name: Test
        run: dotnet test --configuration Release

      # The gap this step exists to close: every test in Sdlc.Tests asserts STRINGS in the scaffold
      # templates, so a template that generates code which does not compile passes the entire suite.
      # It has already happened twice in one change -- a `--` inside an XML comment, which is illegal
      # and kills the generated solution's first build, and then a CA1859 that warnings-as-errors
      # turns into an error. Neither was visible until a solution was generated and built.
      #
      # So: generate one, build it, and run its own tests -- which is also what exercises the
      # architecture rules the skeleton ships, in the only place they can actually run.
      - name: Generate a scaffolded solution
        run: dotnet run --project tools/Sdlc.ScaffoldHarness --configuration Release -- "${{ runner.temp }}/scaffold" Demo

      - name: Build the scaffolded solution
        run: dotnet build --configuration Release "${{ runner.temp }}/scaffold/Demo.slnx"

      - name: Test the scaffolded solution
        run: dotnet test --configuration Release "${{ runner.temp }}/scaffold/Demo.slnx"

      # The second gap, and the same shape as the first: every check above runs the binary from its
      # build output, which sits inside this tree -- so the gate always finds CONSTRAINTS.md by walking
      # up to the repository root, and the packed artifact is never exercised at all. That is how the
      # package came to ship no library: an installed tool answered `help` and `version` and nothing
      # else, both generated pipelines installed a gate whose one non-bypassable check could never
      # pass, and 468 tests agreed everything was fine. D-41 embedded the library; these steps
      # are what would have caught it, because they are the only ones run from outside the tree.
      #
      # The package packed here is the one released: cd.yml downloads it rather than building again.
      - name: Pack the tool
        run: >
          dotnet pack src/Sdlc.Cli/Sdlc.Cli.csproj
          --configuration Release
          -p:Version=${{ needs.version.outputs.version }}
          -o "${{ runner.temp }}/pack"

      - name: Install the packed tool
        run: >
          dotnet tool install MofonCode.Sdlc.Cli
          --add-source "${{ runner.temp }}/pack"
          --tool-path "${{ runner.temp }}/tool"
          --version ${{ needs.version.outputs.version }}

      # Renders the effective set, which is the command that needs the library and the one a person
      # should run as a smoke test. `help` and `version` are the two that cannot detect this.
      #
      # SDLC_CONSTRAINTS is deliberately not set, and the working directory is deliberately not this
      # repository. Both of those would hand the tool the file it is supposed to no longer need.
      - name: The installed tool finds its constraint library
        working-directory: ${{ runner.temp }}
        run: '"${{ runner.temp }}/tool/sdlc" constraints'

      # The package answers with the version it will be published as, so the number a solution will pin is
      # the number it runs -- and carries the skills 'sdlc claude' starts a session with, which is how a
      # solution's pin reaches them.
      - name: The packed tool is the version it will be published as
        working-directory: ${{ runner.temp }}
        run: |
          first="$("${{ runner.temp }}/tool/sdlc" version | head -n 1)"
          [ "$first" = "sdlc ${{ needs.version.outputs.version }}" ] || { echo "::error::The packed tool says '$first'."; exit 1; }
          packed="$(find "${{ runner.temp }}/tool/.store" -path '*/plugin/.claude-plugin/plugin.json' | head -n 1)"
          [ -n "$packed" ] || { echo "::error::The packed tool carries no plugin."; exit 1; }
          grep -q '"version": "${{ needs.version.outputs.version }}"' "$packed" || { echo "::error::The packed plugin is not ${{ needs.version.outputs.version }}."; exit 1; }

      # Kept on every run, a pull request's included: it is how a branch's build reaches a machine without
      # being published -- download it, install it to a folder, and point SDLC_DEV_BUILD there (D-135). A push's
      # is what cd.yml releases, kept as long as a pending approval can wait.
      - uses: actions/upload-artifact@v6
        with:
          name: nupkg
          path: ${{ runner.temp }}/pack/*
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 30 || 7 }}

      # The factory's agent image (factory/README.md, D-96). The suite reads the Dockerfile as text, so
      # an image that no longer builds -- a moved path, a package gone from an apt source, an installer
      # that changed its arguments -- passes every test above. Build it, and ask the binary inside it
      # for its version, which is the line the factory pipeline compares to decide whether to reinstall.
      - name: Build the factory agent image
        run: docker build -f factory/Dockerfile -t ai-sdlc-factory-agent .

      # Exactly "sdlc <version>", with no CR: the pipeline compares the whole line, and a binary packed from
      # CRLF sources prints one and is reinstalled every run.
      - name: The image carries the binary
        run: |
          first="$(docker run --rm --entrypoint sdlc ai-sdlc-factory-agent version | head -n 1)"
          echo "$first"
          case "$first" in
            *$'\r'*) echo 'The version line ends in CR, so the factory pipeline would reinstall sdlc on every run.'; exit 1 ;;
            *-local*) echo 'The image calls its binary a local build, so every round the factory wrote would be refused a pull request.'; exit 1 ;;
            'sdlc '*) ;;
            *) echo 'The image did not answer with its version.'; exit 1 ;;
          esac

