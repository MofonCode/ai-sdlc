name: ci

# windows-latest is not a preference. The shipped tooling is PowerShell and the solutions this
# framework scaffolds are .NET, so the runner has to be the platform the framework is used on —
# path separators, line endings and native-command stderr handling all differ elsewhere, and a
# green build on Linux would hide every one of them.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # For the `skills` job below, which bills the model and so does not run on every push.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # v02 ran these with continue-on-error because `claude` was not guaranteed on a runner.
      # Two manifest defects shipped green through exactly that: a hooks.json whose events sat
      # outside the `hooks` object, so the plugin never loaded, and a skill whose unquoted
      # argument-hint made the YAML parser drop every field. An advisory gate teaches everyone
      # to ignore it. So the CLI is installed and the validation below is a hard gate.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # Not --strict, for one known warning: a CLAUDE.md at the plugin root is not loaded as
      # plugin context, and the validator says so. It is here for people working in this
      # repository, because Claude Code reads AGENTS.md directly only from v2.1.277. When that
      # floor is acceptable for every contributor, CLAUDE.md goes away and this regains --strict.
      - name: Validate the plugin manifest
        run: claude plugin validate .claude-plugin/plugin.json

      - name: Validate the marketplace manifest
        run: claude plugin validate . --strict

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The suite asserts the properties the design claims: that the schemas reject what they
      # should, that every constraint forbids something and names no stack, that every sample artifact
      # is evaluated by exactly one expectation, and that a materialized workspace is a real git
      # repository which never mutates the checked-in copy.
      - name: Build and test
        run: dotnet test --configuration Debug --nologo

      # .editorconfig is the standard; this step is what makes it one. EnforceCodeStyleInBuild in
      # Directory.Build.props covers the analyzer rules but not whitespace, which defaults to silent -
      # so a trailing space sat on a test method through a hundred green runs and this same hard gate.
      # An unenforced standard is a preference, and a preference does not survive a second contributor.
      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

  # Skill behaviour, asserted by running the skill rather than by checking the things around it.
  # Every other job here establishes that a skill's frontmatter parses, that the scripts it names
  # exist, and that the schema governing its output rejects what it should. None of that says an
  # interrogation reaches the right verdict, which is the only thing the framework is for.
  #
  # Not on push or pull_request, deliberately. Each case invokes the model, so the suite costs real
  # money and about forty seconds per case; a gate that bills every push gets switched off. Nightly
  # plus on demand keeps the signal without the tax.
  #
  # It is not `claude plugin eval`: that is early access and unavailable on this account, so building
  # on it would block this on something outside our control.
  skills:
    # The whole workflow triggers, not a job, so without this the model would be billed on every push
    # and every pull request - which is precisely what the comment above says not to do.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # A missing credential is a configuration gap, not a defect in the framework, so it says so and
      # stops rather than failing nine cases with an authentication error apiece.
      - name: Check for a credential
        id: credential
        shell: pwsh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANTHROPIC_API_KEY)) {
            Write-Host '::warning::No ANTHROPIC_API_KEY secret is set, so the headless skill cases cannot run. Add it in the repository settings.'
            'present=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          else {
            'present=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Install Claude Code
        if: steps.credential.outputs.present == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # The directory source, so this needs no published package and no public repository: the
      # checkout is the marketplace.
      - name: Install the plugin from the checkout
        if: steps.credential.outputs.present == 'true'
        run: |
          claude plugin marketplace add ./
          claude plugin install sdlc@ai-sdlc

      - name: Interrogate the golden artifacts
        if: steps.credential.outputs.present == 'true'
        env:
          SDLC_HEADLESS: '1'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: dotnet test --configuration Debug --nologo --filter InterrogatingAGoldenArtifact

# A disagreeing case is re-run and reported as flaky, never retried silently. CON_06 asks whether a
# proof is adequate, which is the constraint with real variance: plan.good.md has drawn a finding on
# one run and none on the next with nothing changed. Automatic retries here would hide exactly the
# thing worth knowing.
