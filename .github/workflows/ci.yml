name: ci

# windows-latest is not a preference. The framework is committed to Windows PowerShell 5.1,
# which exists only on Windows, and the suite parses every shipped script with the REAL 5.1
# parser — the only way the BOM and ANSI-decoding defects were catchable at all.
on:
  push:
    branches: [master, 'bootstrap', 'cycle-*', 'intent-*']
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The fact gatherer pins the commit it ran at and the lifecycle derivation reads
          # branches and merge state, so a shallow clone would make both lie.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build and test
        run: dotnet test --configuration Debug

      # JUSTIFIED BYPASS (INV-06). These two steps are advisory because `claude` is not
      # guaranteed on a hosted runner, and a step that fails because a tool is absent teaches
      # everyone to ignore the step. What they must not become is the reason a defect survives:
      # both manifest defects they would have caught locally — a hooks.json whose events sat
      # outside the `hooks` object, so the whole plugin failed to load, and a skill whose
      # unquoted argument-hint made the real YAML parser drop every field including
      # disable-model-invocation — shipped green through this file for exactly that reason.
      #
      # So the suite now covers both classes itself, with the real parsers: SkillFrontmatterTests
      # reads every skill's frontmatter through YamlDotNet, and PluginManifestTests asserts the
      # hook manifest's shape. Those fail the build. These stay advisory, and remain worth running
      # because the loader's own validator sees things no test of ours anticipates.
      # Reviewed 2026-09-25.
      - name: Validate the plugin manifest
        run: claude plugin validate .claude-plugin/plugin.json --strict
        continue-on-error: true

      - name: Validate the marketplace manifest
        run: claude plugin validate . --strict
        continue-on-error: true
